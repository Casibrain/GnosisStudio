<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preload" as="style" href="%sveltekit.assets%/fonts/Nunito.css" />
		<link rel="preload" as="style" href="%sveltekit.assets%/fonts/Noto.css" />
		<link rel="preload" as="style" href="%sveltekit.assets%/fonts/JetBrainsMono.css" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/branding/favicon.svg" />
		<link rel="stylesheet" href="%sveltekit.assets%/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<base target="_blank">
		<!--
			必须在 %sveltekit.head% 之前，且是普通 script（不是 module）：
			src/lib/globals.svelte.js 在模块求值时就读取 window.electron，
			晚一步拿到 undefined，所有 {#if electron} 分支都不渲染 —— 白屏。
		-->
		<script src="%sveltekit.assets%/preload-bridge.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">
			%sveltekit.body%
		</div>
	</body>
</html>
